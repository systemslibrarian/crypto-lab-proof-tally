name: PR-06 focused mutation evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abort-model-mutations:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/pr06-dp-aborts-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Replay the six PR-06 mutations
        run: >-
          npm run test:kills --
          abort-threshold
          abort-probability
          abort-ratio
          abort-retry-cap
          abort-conditioned-bound
          abort-view-boundary
